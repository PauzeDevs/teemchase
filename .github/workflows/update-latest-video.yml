name: Update latest YouTube video

on:
  push:
    paths:
      - ".github/workflows/update-latest-video.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-youtube-video
  cancel-in-progress: true

jobs:
  update-latest-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch latest upload metadata
        run: |
          python -m pip install --upgrade yt-dlp
          yt-dlp --skip-download --playlist-items 1 --no-warnings --print "%(id)s\t%(title)s\t%(upload_date)s" "https://www.youtube.com/@teemchase/videos" > latest-video.tsv
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          line = Path("latest-video.tsv").read_text(encoding="utf-8").strip()
          parts = line.split("\t", 2)
          if len(parts) < 2:
              raise SystemExit(f"Unexpected yt-dlp output: {line!r}")

          video_id, title = parts[0].strip(), parts[1].strip()
          upload_date = parts[2].strip() if len(parts) > 2 else ""
          if not re.fullmatch(r"[A-Za-z0-9_-]{11}", video_id):
              raise SystemExit(f"Invalid YouTube video ID: {video_id!r}")
          if not title:
              raise SystemExit("Latest upload title is empty.")

          published_at = ""
          if re.fullmatch(r"\d{8}", upload_date):
              published_at = f"{upload_date[:4]}-{upload_date[4:6]}-{upload_date[6:8]}T00:00:00Z"

          data = {
              "videoId": video_id,
              "title": title,
              "publishedAt": published_at,
              "url": f"https://www.youtube.com/watch?v={video_id}",
              "thumbnail": f"https://img.youtube.com/vi/{video_id}/hqdefault.jpg",
              "channelUrl": "https://www.youtube.com/@teemchase"
          }
          Path("data").mkdir(exist_ok=True)
          Path("data/latest-video.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"Latest upload: {title} ({video_id})")
          PY
          rm latest-video.tsv

      - name: Commit latest video metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-video.json
          if git diff --cached --quiet; then
            echo "Latest video metadata is already current."
          else
            git commit -m "(chore): update latest YouTube video"
            git push
          fi
