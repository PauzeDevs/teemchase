name: Update latest YouTube video

on:
  push:
    paths:
      - ".github/workflows/update-latest-video.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-youtube-video
  cancel-in-progress: false

jobs:
  update-latest-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest upload metadata
        run: |
          python -m pip install --upgrade yt-dlp
          yt-dlp --skip-download --flat-playlist --playlist-items 1 --no-warnings --dump-single-json "https://www.youtube.com/@teemchase/videos" > latest-video.raw.json
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          payload = json.loads(Path("latest-video.raw.json").read_text(encoding="utf-8"))
          entries = payload.get("entries") if isinstance(payload, dict) else None
          video = next((entry for entry in (entries or []) if entry), None)
          if video is None and isinstance(payload, dict) and payload.get("id"):
              video = payload
          if not video:
              raise SystemExit("yt-dlp returned no video entry.")

          video_id = str(video.get("id") or "").strip()
          title = str(video.get("title") or "").strip()
          upload_date = str(video.get("upload_date") or "").strip()
          if not re.fullmatch(r"[A-Za-z0-9_-]{11}", video_id):
              raise SystemExit(f"Invalid YouTube video ID: {video_id!r}")
          if not title:
              raise SystemExit("Latest upload title is empty.")

          published_at = ""
          if re.fullmatch(r"\d{8}", upload_date):
              published_at = f"{upload_date[:4]}-{upload_date[4:6]}-{upload_date[6:8]}T00:00:00Z"

          metadata = {
              "videoId": video_id,
              "title": title,
              "publishedAt": published_at,
              "url": f"https://www.youtube.com/watch?v={video_id}",
              "thumbnail": f"https://img.youtube.com/vi/{video_id}/hqdefault.jpg",
              "channelUrl": "https://www.youtube.com/@teemchase"
          }
          Path("data").mkdir(exist_ok=True)
          output = json.dumps(metadata, ensure_ascii=False, indent=2) + "\n"
          Path("data/latest-video.json").write_text(output, encoding="utf-8")
          Path(os.environ["RUNNER_TEMP"], "latest-video.json").write_text(output, encoding="utf-8")
          print(f"Fetched latest upload: {title} ({video_id})")
          PY
          rm latest-video.raw.json

      - name: Commit latest video metadata with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/latest-video.json" data/latest-video.json
            git add data/latest-video.json

            if git diff --cached --quiet; then
              echo "Latest video metadata is already current."
              exit 0
            fi

            git commit -m "(chore): update latest YouTube video"
            if git push origin HEAD:main; then
              echo "Latest video metadata was published to main."
              exit 0
            fi

            echo "Push attempt $attempt failed because main changed; retrying."
          done

          echo "Could not publish latest video metadata after 3 attempts."
          exit 1
